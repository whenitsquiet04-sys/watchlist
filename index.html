<title>The Watchlist</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#FCFAF7}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wl-root{--ink:#241B2E;--ink-soft:#6E6377;--paper:#FCFAF7;--panel:#2C2138;--panel-2:#3A2C4A;
  --amber:#E8A13C;--amber-deep:#B9741F;--line:#EAE2E8;--rose:#F3EDF2;--green:#3F8F5B;
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--paper);
  min-height:100dvh;-webkit-font-smoothing:antialiased}
.wl-root *{box-sizing:border-box}
.wl-head{background:var(--panel);color:var(--paper);padding-top:env(safe-area-inset-top);
  background-image:radial-gradient(120% 140% at 85% -20%,#47365b 0%,var(--panel) 55%)}
.wl-head-inner{max-width:880px;margin:0 auto;padding:26px 22px 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.wl-title{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:38px;line-height:1;margin:0;font-weight:600;letter-spacing:.2px}
.wl-marquee{display:flex;gap:9px;margin:12px 0 10px}
.wl-marquee i{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px rgba(232,161,60,.55);display:block}
.wl-marquee i:nth-child(even){background:#F0C079}
.wl-sub{margin:0;color:#D8CFE0;font-size:15.5px;max-width:46ch;line-height:1.45}
.wl-add{display:inline-flex;align-items:center;gap:8px;background:var(--amber);color:#2A1B06;border:none;border-radius:12px;
  padding:13px 18px;font-size:16px;font-weight:650;cursor:pointer;box-shadow:0 2px 0 var(--amber-deep);white-space:nowrap}
.wl-add:hover{background:#F0AE4E}
.wl-add:active{transform:translateY(1px);box-shadow:0 1px 0 var(--amber-deep)}
.wl-main{max-width:880px;margin:0 auto;padding:20px 22px calc(60px + env(safe-area-inset-bottom))}
.wl-tabs{display:flex;gap:4px;background:var(--rose);border-radius:13px;padding:5px;margin-bottom:16px}
.wl-tab{flex:1;border:none;background:transparent;color:var(--ink-soft);font-size:16px;font-weight:650;padding:12px;border-radius:9px;cursor:pointer}
.wl-tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(36,27,46,.12)}
.wl-kind{display:flex;gap:8px;margin-bottom:14px}
.wl-kind .wl-seg-btn{flex:0 0 auto;min-width:120px}
.wl-controls{display:flex;gap:10px;align-items:stretch;margin-bottom:14px;flex-wrap:wrap}
.wl-search{flex:1;min-width:180px;display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:0 13px}
.wl-search:focus-within{border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,161,60,.22)}
.wl-search input{border:none;outline:none;font:inherit;font-size:16px;padding:11px 0;flex:1;background:transparent;color:var(--ink)}
.wl-search svg{color:var(--ink-soft);flex:0 0 auto}
.wl-groupby{display:flex;gap:6px;flex:0 0 auto}
.wl-groupby .wl-seg-btn{min-width:92px}
.wl-filters{display:flex;gap:9px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.wl-chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;background:transparent;border:1.5px solid var(--line);
  color:var(--ink-soft);border-radius:999px;padding:9px 15px;font-size:14.5px;font-weight:550;cursor:pointer;white-space:nowrap}
.wl-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wl-chip:hover:not(.on){border-color:#cfc4cd}
.wl-chip.sm{padding:7px 12px;font-size:13.5px}
.wl-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.wl-browsehint{margin:2px 0 6px;font-size:14px;color:var(--ink-soft)}
.wl-browsehint strong{color:var(--amber-deep)}
.wl-group{margin-top:20px}
.wl-month{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.wl-month h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:23px;margin:0;font-weight:600}
.wl-count{color:var(--ink-soft);font-size:14px;font-variant-numeric:tabular-nums}
.wl-year{background:var(--ink);color:var(--paper);font-weight:700;font-size:13px;letter-spacing:1.5px;padding:6px 12px;border-radius:8px;margin:22px 0 0}
.wl-year + .wl-group{margin-top:6px}
.wl-pband{display:flex;align-items:center;gap:9px;color:#fff;font-weight:700;font-size:15px;padding:9px 13px;border-radius:9px}
.wl-pc{margin-left:auto;background:rgba(255,255,255,.28);border-radius:999px;font-size:12.5px;padding:2px 9px;font-weight:700}
.wl-mark{background:#FBE7C4;border-radius:3px;padding:0 2px}
.wl-list{list-style:none;margin:0;padding:0}
.wl-row{display:flex;gap:14px;align-items:flex-start;padding:17px 4px;border-bottom:1px solid var(--line)}
.wl-spine{width:5px;align-self:stretch;border-radius:3px;flex:0 0 auto;min-height:40px}
.wl-body{flex:1;min-width:0}
.wl-name{font-size:19px;font-weight:650;margin:0 0 7px;line-height:1.25}
.wl-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:15px}
.wl-date{display:inline-flex;align-items:center;gap:6px;color:var(--amber-deep);font-weight:600}
.wl-rel{background:var(--rose);color:#7A4C8A;font-weight:600;font-size:13px;padding:3px 9px;border-radius:999px}
.wl-cad{color:var(--ink);font-weight:550}
.wl-cad::before{content:"·";margin-right:12px;color:var(--ink-soft)}
.wl-svc{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);font-weight:550}
.wl-status{display:inline-flex;align-items:center;gap:6px;margin:8px 0 0;font-size:13.5px;font-weight:600;color:var(--ink-soft)}
.wl-status.done{color:var(--green)}
.wl-desc{margin:7px 0 0;color:var(--ink-soft);font-size:14.5px;line-height:1.4;max-width:62ch}
.wl-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.wl-tag{font-size:12px;font-weight:600;color:var(--ink-soft);background:var(--rose);border-radius:6px;padding:3px 8px}
.wl-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.wl-trailer{display:inline-flex;align-items:center;gap:7px;text-decoration:none;border:1.5px solid var(--amber);
  color:var(--amber-deep);background:#fff;border-radius:10px;padding:9px 13px;font-size:14.5px;font-weight:600;cursor:pointer}
.wl-trailer:hover{background:#FDF3E3}
.wl-icon{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1.5px solid var(--line);
  background:#fff;border-radius:10px;color:var(--ink-soft);cursor:pointer}
.wl-icon:hover{border-color:#cfc4cd;color:var(--ink)}
.wl-check{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1.5px solid var(--line);background:#fff;border-radius:50%;color:var(--ink-soft);cursor:pointer}
.wl-check:hover{border-color:var(--green);color:var(--green)}
.wl-check.on{background:var(--green);border-color:var(--green);color:#fff}
.wl-new{display:inline-block;background:var(--amber);color:#2A1B06;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:8px;vertical-align:middle}
.wl-tabdot{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;margin-left:7px;background:var(--amber);color:#2A1B06;border-radius:999px;font-size:11px;font-weight:800;vertical-align:middle}
.wl-addbtn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:11px 15px;font-size:14.5px;
  font-weight:650;cursor:pointer;background:var(--amber);color:#2A1B06;box-shadow:0 2px 0 var(--amber-deep)}
.wl-addbtn:active{transform:translateY(1px);box-shadow:0 1px 0 var(--amber-deep)}
.wl-addbtn.on{background:#EAF3EC;color:var(--green);box-shadow:none;border:1.5px solid #BFE0C8}
.wl-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:15px;padding:2px 0}
.wl-danger{display:inline-flex;align-items:center;gap:6px;background:#B4322B;color:#fff;border:none;border-radius:9px;padding:8px 13px;font-weight:600;font-size:14.5px;cursor:pointer}
.wl-danger:hover{background:#C33A32}
.wl-ghost{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid var(--line);color:var(--ink);border-radius:11px;padding:12px 17px;font-size:15.5px;font-weight:600;cursor:pointer}
.wl-ghost:hover{border-color:#cfc4cd}
.wl-ghost.sm{padding:8px 13px;font-size:14.5px;border-radius:9px}
.wl-empty{color:var(--ink-soft);padding:50px 0;text-align:center}
.wl-empty-card{text-align:center;border:1.5px dashed var(--line);border-radius:16px;padding:40px 24px;margin-top:12px;background:#fff}
.wl-empty-title{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;margin:0 0 6px}
.wl-empty-body{color:var(--ink-soft);margin:0 0 18px;font-size:15.5px}
.wl-empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wl-foot{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);text-align:center}
.wl-link{background:none;border:none;color:var(--amber-deep);font-size:14.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.wl-link:hover{text-decoration:underline}
.wl-note{color:var(--ink-soft);font-size:13px;margin:8px 0 0}
.wl-overlay{position:fixed;inset:0;background:rgba(36,27,46,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:24px;z-index:50;overflow-y:auto}
.wl-modal{background:var(--paper);border-radius:18px;width:100%;max-width:540px;margin:auto;box-shadow:0 24px 60px rgba(36,27,46,.32);overflow:hidden}
.wl-modal-head{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;background:var(--panel);color:var(--paper)}
.wl-modal-head h2{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:22px;margin:0;font-weight:600}
.wl-modal-head .wl-icon{background:transparent;border-color:rgba(255,255,255,.25);color:#EADFF0}
.wl-form{padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.wl-field{display:flex;flex-direction:column;gap:7px}
.wl-field>span{font-size:14.5px;font-weight:600}
.wl-field em{color:var(--ink-soft);font-style:normal;font-weight:400}
.wl-field input,.wl-field select{font:inherit;font-size:16px;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);width:100%}
.wl-field input:focus,.wl-field select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(232,161,60,.22)}
.wl-toggle{display:inline-flex;align-items:center;gap:9px;background:none;border:none;color:var(--ink);font-size:14.5px;font-weight:550;cursor:pointer;padding:2px 0;margin-top:2px}
.wl-toggle-box{width:22px;height:22px;border:1.5px solid var(--line);border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#fff}
.wl-toggle.on .wl-toggle-box{background:var(--amber);border-color:var(--amber);color:#2A1B06}
.wl-seg{display:flex;gap:8px}
.wl-seg-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:inherit;font-size:14.5px;font-weight:600;
  padding:11px 8px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink-soft);cursor:pointer}
.wl-seg-btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.wl-genres{display:flex;flex-wrap:wrap;gap:7px}
.wl-err{color:#B4322B;font-size:14px;margin:0;font-weight:550}
.wl-modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px 22px}
@media (max-width:580px){
  .wl-head-inner{flex-direction:column;align-items:stretch}
  .wl-add{justify-content:center}
  .wl-row{flex-wrap:wrap}
  .wl-actions{width:100%;padding-left:19px;margin-top:6px}
  .wl-trailer{flex:1;justify-content:center}
  .wl-addbtn{flex:1;justify-content:center}
  .wl-kind .wl-seg-btn{flex:1;min-width:0}
}
@media (prefers-reduced-motion:reduce){.wl-root *{transition:none!important}}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
</style>
</head>

var CATALOGUE = [{"id":"s-hod-3","type":"show","title":"House of the Dragon — Season 3","service":"Max","date":"2026-06-21","endDate":"2026-08-09","cadence":"weekly","genres":["Sci-fi & fantasy","Drama"],"note":"The Targaryen civil war — the Dance of the Dragons — rages on in this Game of Thrones prequel. Season three, complete now."},{"id":"s-silo-3","type":"show","title":"Silo — Season 3","service":"Apple TV+","date":"2026-07-03","endDate":"2026-09-04","cadence":"weekly","genres":["Sci-fi & fantasy","Drama"],"note":"In a giant underground silo, the last of humanity lives by rigid rules no one may question — until engineer Juliette starts digging. Season three (its finale just aired), on Apple TV+."},{"id":"s-ted-lasso","type":"show","title":"Ted Lasso — Season 4","service":"Apple TV+","date":"2026-08-05","cadence":"weekly","episodes":12,"genres":["Comedy","Drama"],"note":"The relentlessly upbeat American coach returns to AFC Richmond three years on, still armed with biscuits, pep talks and big feelings. Season four brings more locker-room heart and hard-won comedy."},{"id":"s-reacher","type":"show","title":"Reacher — Season 4","service":"Prime Video","date":"2026-08-12","cadence":"weekly","genres":["Action","Crime","Thriller"],"note":"Alan Ritchson is back as Jack Reacher, the ex-army drifter who can't walk past an injustice. Season four drops him into a fresh conspiracy where his fists and his deductions do the talking."},{"id":"s-tires","type":"show","title":"Tires — Season 3","service":"Netflix","date":"2026-08-13","cadence":"binge","genres":["Comedy"],"note":"Shane Gillis's crude workplace comedy set in a struggling auto-repair chain, where a hapless manager and his needling cousin trade insults between customers. Season three piles on the low-stakes chaos."},{"id":"s-lanterns","type":"show","title":"Lanterns","service":"Max","date":"2026-08-16","cadence":"weekly","genres":["Sci-fi & fantasy","Mystery"],"note":"A grounded, True-Detective-style take on DC's Green Lanterns: veteran Hal Jordan and rookie John Stewart work an earthbound murder that opens onto a much larger cosmic threat."},{"id":"s-dark-matter","type":"show","title":"Dark Matter — Season 2","service":"Apple TV+","date":"2026-08-28","cadence":"weekly","genres":["Sci-fi & fantasy","Thriller"],"note":"Based on Blake Crouch's novel, a physicist is torn from his life into a version he never chose, and has to fight back across a maze of parallel worlds. Season two widens the multiverse and the danger."},{"id":"s-gentlemen","type":"show","title":"The Gentlemen","service":"Netflix","date":"2026-09-03","cadence":"binge","genres":["Crime","Comedy"],"note":"Guy Ritchie's stylish crime caper: an aristocrat inherits the family estate and discovers a sprawling cannabis empire buried beneath it. Fast-talking gangsters and double-crosses follow."},{"id":"s-chad-powers","type":"show","title":"Chad Powers","service":"Hulu","date":"2026-09-03","cadence":"binge","genres":["Comedy"],"note":"Glen Powell plays a disgraced college quarterback who dons a prosthetic disguise and a fake name to sneak back onto a struggling team. A broad sports comedy; all episodes at once."},{"id":"s-collision","type":"show","title":"Collision","service":"Max","date":"2026-09-07","cadence":"weekly","genres":["Drama","Mystery"],"note":"A new HBO drama; plot details are being kept under wraps ahead of release."},{"id":"s-neagley","type":"show","title":"Neagley","service":"Prime Video","date":"2026-09-16","cadence":"weekly","genres":["Crime","Mystery","Action"],"note":"A Reacher spinoff centred on Frances Neagley, his fiercely capable former colleague, running an investigation of her own. The same lean, punchy action with a sharper solo edge."},{"id":"s-slow-horses","type":"show","title":"Slow Horses — Season 6","service":"Apple TV+","date":"2026-09-16","cadence":"weekly","episodes":6,"genres":["British","Thriller","Drama"],"note":"Gary Oldman's Jackson Lamb leads Slough House, MI5's dumping ground for d     else if(S.tab==="browse"){ eTitle="No "+noun+" match that filter"; eBody="Try another genre above."; eActions=""; }
    else if(S.tab==="watched"){ eTitle="No watched "+noun+" yet"; eBody="Tap the round \u2713 on anything in your list and it'll move here."; eActions=""; }
    else { eTitle=(S.kind==="movie"?"No movies yet":"Your list is empty"); eBody="Head to Browse to find "+noun+" and tap Add — they'll show up here."; eActions="<button class='wl-add' data-act='tab' data-tab='browse'>"+icon("search",18)+" Browse "+noun+"</button><button class='wl-ghost' data-act='add'>"+icon("plus",18)+" Add manually</button>"; }
    return "<div class='wl-empty-card'><p class='wl-empty-title'>"+eTitle+"</p><p class='wl-empty-body'>"+eBody+"</p>"+(eActions?"<div class='wl-empty-actions'>"+eActions+"</div>":"")+"</div>";
  }
  var out="";
  if(S.groupBy==="service"){
    groups.forEach(function(g){
      out+="<section class='wl-group'><div class='wl-pband' style='background:"+serviceColor(g.service)+"'>"+esc(g.label)+"<span class='wl-pc'>"+g.items.length+"</span></div><ul class='wl-list'>";
      g.items.forEach(function(s){ out+= S.tab==="browse"?browseRowHTML(s):listRowHTML(s); });
      out+="</ul></section>";
    });
  } else {
    var lastBand=null;
    groups.forEach(function(g){
      if(g.band && g.band!==lastBand){ out+="<div class='wl-year'>"+esc(g.band)+"</div>"; lastBand=g.band; }
      out+="<section class='wl-group'><div class='wl-month'><h2>"+esc(g.sub||"Date to be announced")+"</h2><span class='wl-count'>"+g.items.length+"</span></div><ul class='wl-list'>";
      g.items.forEach(function(s){ out+= S.tab==="browse"?browseRowHTML(s):listRowHTML(s); });
      out+="</ul></section>";
    });
  }
  return out;
}
function fillResults(){ var el=document.getElementById("wl-results"); if(el) el.innerHTML=resultsHTML(); }
function modalHTML(){
  var e=ES;
  var svcOpts=SERVICE_NAMES.map(function(n){return "<option"+(e.service===n?" selected":"")+">"+esc(n)+"</option>";}).join("")+"<option value='Other'"+(e.service==="Other"?" selected":"")+">Other…</option>";
  var h="<div class='wl-overlay'><div class='wl-modal'>";
  h+="<div class='wl-modal-head'><h2>"+(e.id?"Edit":"Add")+" "+(e.type==="movie"?"a movie":"a show")+"</h2><button class='wl-icon' data-act='close' aria-label='Close'>"+icon("x",22)+"</button></div>";
  h+="<div class='wl-form'>";
  h+="<div class='wl-field'><span>Type</span><div class='wl-seg'>"+
     "<button class='wl-seg-btn"+(e.type==="show"?" on":"")+"' data-act='m-type' data-type='show'>"+icon("tv",16)+" Show</button>"+
     "<button class='wl-seg-btn"+(e.type==="movie"?" on":"")+"' data-act='m-type' data-type='movie'>"+icon("film",16)+" Movie</button></div></div>";
  h+="<div class='wl-field'><span>Name</span><input id='f-title' value='"+esc(e.title)+"' placeholder='"+(e.type==="movie"?"e.g. The Thursday Murder Club":"e.g. Professor T")+"'></div>";
  h+="<div class='wl-field'><span>Where to watch</span><select id='f-service'>"+svcOpts+"</select></div>";
  if(e.service==="Other")h+="<div class='wl-field'><span>Service name</span><input id='f-other' value='"+esc(e.otherSvc)+"' placeholder='Type the service'></div>";
  h+="<div class='wl-field'><span>"+(e.type==="movie"?"Release date":"Premiere date")+"</span>"+
     (e.tba?"<input id='f-tbaLabel' value='"+esc(e.tbaLabel)+"' placeholder='e.g. Fall 2026'>":"<input id='f-date' type='date' value='"+esc(e.date)+"'>")+
     "<button class='wl-toggle"+(e.tba?" on":"")+"' data-act='m-tba'><span class='wl-toggle-box'>"+(e.tba?icon("check",14):"")+"</span>Date not announced yet</button></div>";
  if(e.type==="show"){
    h+="<div class='wl-field'><span>How it drops</span><div class='wl-seg'>"+
       ["binge","weekly","tba"].map(function(k){return "<button class='wl-seg-btn"+(e.cadence===k?" on":"")+"' data-act='m-cad' data-cad='"+k+"'>"+CADENCE[k].pill+"</button>";}).join("")+"</div></div>";
    if(e.cadence==="weekly")h+="<div class='wl-field'><span>Number of episodes <em>(optional — used to estimate the finale)</em></span><input id='f-episodes' type='number' min='1' value='"+esc(e.episodes)+"' placeholder='e.g. 8'></div>";
    if(e.cadence==="weekly"&&!e.tba)h+="<div class='wl-field'><span>Finale date <em>(optional — overrides the estimate)</em></span><input id='f-endDate' type='date' value='"+esc(e.endDate)+"'></div>";
  }
  h+="<div class='wl-field'><span>Genres <em>(optional)</em></span><div class='wl-genres'>"+
     ALL_GENRES.map(function(g){return "<button class='wl-chip sm"+(e.genres.indexOf(g)>=0?" on":"")+"' data-act='m-genre' data-genre='"+esc(g)+"'>"+esc(g)+"</button>";}).join("")+"</div></div>";
  h+="<div class='wl-field'><span>Trailer link <em>(optional)</em></span><input id='f-trailer' value='"+esc(e.trailer)+"' placeholder='Leave blank to search YouTube automatically'></div>";
  h+="<div class='wl-field'><span>Note <em>(optional)</em></span><input id='f-note' value='"+esc(e.note)+"' placeholder='e.g. cast, or why you want to watch'></div>";
  if(e.err)h+="<p class='wl-err'>"+esc(e.err)+"</p>";
  h+="</div>";
  h+="<div class='wl-modal-foot'><button class='wl-ghost' data-act='close'>Cancel</button><button class='wl-add' data-act='save'>"+(e.id?"Save changes":"Add to list")+"</button></div>";
  h+="</div></div>";
  return h;
}
function render(){ document.getElementById("app").innerHTML=headerHTML()+mainHTML()+(S.edit?modalHTML():""); fillResults(); }

function openEditor(item){
  if(item){
    var known=SERVICE_NAMES.indexOf(item.service)>=0;
    ES={ id:item.id, type:item.type||"show", title:item.title||"", service:known?item.service:"Other", otherSvc:known?"":item.service,
      tba:!item.date, date:item.date||"", tbaLabel:item.tbaLabel||"2026", cadence:item.cadence||"binge",
      episodes:item.episodes||"", endDate:item.endDate||"", genres:(item.genres||[]).slice(), trailer:item.trailer||"", note:item.note||"", err:"" };
  } else {
    ES={ id:null, type:"show", title:"", service:"Netflix", otherSvc:"", tba:false, date:"", tbaLabel:"2026", cadence:"binge",
      episodes:"", endDate:"", genres:[], trailer:"", note:"", err:"" };
  }
}
function readInputs(){
  if(!S.edit)return; var g=function(id){return document.getElementById(id);};
  if(g("f-title"))ES.title=g("f-title").value;
  if(g("f-service"))ES.service=g("f-service").value;
  if(g("f-other"))ES.otherSvc=g("f-other").value;
  if(g("f-date"))ES.date=g("f-date").value;
  if(g("f-tbaLabel"))ES.tbaLabel=g("f-tbaLabel").value;
  if(g("f-episodes"))ES.episodes=g("f-episodes").value;
  if(g("f-endDate"))ES.endDate=g("f-endDate").value;
  if(g("f-trailer"))ES.trailer=g("f-trailer").value;
  if(g("f-note"))ES.note=g("f-note").value;
}
function saveEditor(){
  readInputs();
  var svc=ES.service==="Other"?ES.otherSvc.trim():ES.service;
  if(!ES.title.trim()){ES.err="Give it a name.";render();return;}
  if(!svc){ES.err="Choose where to watch.";render();return;}
  if(!ES.tba&&!ES.date){ES.err="Add a date, or switch on \u201CDate not announced yet.\u201D";render();return;}
  var item={ id:ES.id||("u-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)), type:ES.type, title:ES.title.trim(), service:svc,
    date:ES.tba?null:ES.date };
  if(ES.tba)item.tbaLabel=ES.tbaLabel.trim()||"2026";
  if(ES.type==="show")item.cadence=ES.cadence;
  if(ES.type==="show"&&ES.cadence==="weekly"&&ES.episodes)item.episodes=Number(ES.episodes);
  if(ES.type==="show"&&!ES.tba&&ES.endDate)item.endDate=ES.endDate;
  if(ES.genres.length)item.genres=ES.genres.slice();
  if(ES.trailer.trim())item.trailer=ES.trailer.trim();
  if(ES.note.trim())item.note=ES.note.trim();
  if(ES.id&&S.list.some(function(x){return x.id===ES.id;})) S.list=S.list.map(function(x){return x.id===ES.id?item:x;});
  else S.list=S.list.concat([item]);
  S.edit=null; ES=null; persist();
}
function onClick(ev){
  if(ev.target&&ev.target.classList&&ev.target.classList.contains("wl-overlay")){ S.edit=null;ES=null;render();return; }
  var el=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!el)return;
  var a=el.getAttribute("data-act"), id=el.getAttribute("data-id");
  if(a==="tab"){ S.tab=el.getAttribute("data-tab"); if(S.tab==="browse")markSeenAll(); render(); }
  else if(a==="kind"){ S.kind=el.getAttribute("data-kind"); render(); }
  else if(a==="genre"){ S.genre=el.getAttribute("data-genre"); render(); }
  else if(a==="group"){ S.groupBy=el.getAttribute("data-group"); render(); }
  else if(a==="add"){ S.edit=true; openEditor(null); render(); }
  else if(a==="edit"){ S.edit=true; openEditor(byId(S.list,id)); render(); }
  else if(a==="ask-remove"){ S.confirm=id; render(); }
  else if(a==="cancel-remove"){ S.confirm=null; render(); }
  else if(a==="remove"){ S.list=S.list.filter(function(x){return x.id!==id;}); S.confirm=null; persist(); }
  else if(a==="toggle-watched"){ S.list=S.list.map(function(x){return x.id===id?Object.assign({},x,{watched:!x.watched}):x;}); S.confirm=null; persist(); }
  else if(a==="toggle-cat"){ if(inList(id)){ S.list=S.list.filter(function(x){return x.id!==id;}); } else { var c=byId(CATALOGUE,id); if(c){ var r={}; for(var k in c){ if(k!=="starter")r[k]=c[k]; } S.list=S.list.concat([r]); } } persist(); }
  else if(a==="close"){ S.edit=null; ES=null; render(); }
  else if(a==="save"){ saveEditor(); }
  else if(a==="m-type"){ readInputs(); ES.type=el.getAttribute("data-type"); render(); }
  else if(a==="m-cad"){ readInputs(); ES.cadence=el.getAttribute("data-cad"); render(); }
  else if(a==="m-tba"){ readInputs(); ES.tba=!ES.tba; render(); }
  else if(a==="m-genre"){ readInputs(); var g=el.getAttribute("data-genre"); var i=ES.genres.indexOf(g); if(i>=0)ES.genres.splice(i,1); else ES.genres.push(g); render(); }
}
document.addEventListener("click",onClick);
document.addEventListener("input",function(e){ if(e.target&&e.target.id==="wl-search"){ S.query=e.target.value; fillResults(); } });
load(); render(); fetchRemote();
</script>
